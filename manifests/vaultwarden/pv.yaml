apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  labels:
    app: vaultwarden
    app.kubernetes.io/name: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: sbs-default-retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-attachments
  labels:
    app: vaultwarden
    app.kubernetes.io/name: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: sbs-default-retain
